{% extends 'prototipadoapp/base.html' %}

{% block title %}NUAM - Autenticación Institucional{% endblock %}

{% block content %}
<section class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
        <span class="brand-badge fs-4">NUAM</span>
        <h5 class="mt-3 fw-bold text-dark">Mantenedor de Calificaciones Tributarias</h5>
        <p class="text-muted small mb-0">Mercado Regional Integrado: Chile · Perú · Colombia</p>
        </div>

        <form id="formLogin" onsubmit="procesarLoginJwt(event)">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-medium small">Correo Institucional</label>
            <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" id="loginEmail" class="form-control" placeholder="usuario@nuamx.com" value="c.rojas@nuamx.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-medium small">Contraseña</label>
            <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control" placeholder="Contraseña" required>
            </div>
        </div>

        <button type="submit" class="btn btn-nuam w-100 py-2 mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión Segura (TLS 1.3)
        </button>
        </form>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function procesarLoginJwt(event) {
        event.preventDefault();
        const payload = {
            email_inst: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };

        try {
            const response = await fetch('/api/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                alert('Inicio de sesión exitoso.');
                window.location.href = '/corredor/ver/';
            } else {
                alert(data.error || 'Error de autenticación.');
            }
        } catch (err) {
            console.error('Error:', err);
            alert('Error de conexión con el servidor.');
        }
    }
</script>
{% endblock %}
